<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard quản trị BOD</title>
<style>
:root {
  --navy: #1F3A5F; --ink: #1F2933; --muted: #616E7C; --line: #D9E2EC; --bg: #F5F7FA; --card: #FFFFFF;
  --xanh: #2E7D32; --vang: #F2A900; --do: #C62828; --xam: #9AA5B1; --td: #CBD2D9;
  --xanh-bg: #E8F5E9; --vang-bg: #FFF8E1; --do-bg: #FFEBEE; --xam-bg: #EEF1F4;
  --font: "Segoe UI", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 14px/1.5 var(--font); color: var(--ink); background: var(--bg); }
h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 16px; margin: 0 0 8px; } h3 { font-size: 14px; margin: 0 0 6px; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--navy); color: #fff; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; margin-right: auto; } .brand small { color: #C8D6E5; font-size: 12px; }
.controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.controls label { display: flex; flex-direction: column; font-size: 11px; color: #C8D6E5; }
select, input { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
.run-info { font-size: 12px; color: #E3EAF2; max-width: 380px; }
.btn { font: inherit; font-size: 12px; padding: 6px 10px; border-radius: 6px; border: 1px solid #fff; background: transparent; color: #fff; cursor: pointer; }
.icon-btn { display: none; font-size: 20px; background: transparent; border: 0; color: #fff; cursor: pointer; }
.shell { display: flex; min-height: calc(100vh - 60px); }
.sidebar { width: 280px; flex: 0 0 280px; background: #fff; border-right: 1px solid var(--line); padding: 10px 8px; overflow-y: auto; }
.nav-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 13px; }
.nav-item:hover { background: var(--bg); } .nav-item.active { background: #E3EAF2; font-weight: 600; }
.nav-item .n { margin-left: auto; font-size: 11px; color: var(--do); font-weight: 700; }
.nav-group { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 12px 10px 4px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 9px; background: var(--xam); }
.dot.do { background: var(--do); } .dot.vang { background: var(--vang); } .dot.xanh { background: var(--xanh); }
.main { flex: 1; padding: 18px 20px 40px; min-width: 0; }
.grid { display: grid; gap: 14px; } .g4 { grid-template-columns: repeat(4, 1fr); } .g2 { grid-template-columns: 1fr 1fr; } .g6 { grid-template-columns: repeat(6, 1fr); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
.section { margin-top: 14px; }
.stat b { font-size: 26px; display: block; } .stat span { color: var(--muted); font-size: 12px; }
.stat.xanh b { color: var(--xanh); } .stat.vang b { color: #A06F00; } .stat.do b { color: var(--do); } .stat.xam b { color: #52606D; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.p-xanh { background: var(--xanh-bg); color: var(--xanh); } .p-vang { background: var(--vang-bg); color: #7A5600; } .p-do { background: var(--do-bg); color: var(--do); }
.p-xam { background: var(--xam-bg); color: #52606D; } .p-td { background: #F5F7FA; color: var(--muted); }
.tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #EEF1F4; color: #3E4C59; margin: 1px 2px 1px 0; white-space: nowrap; }
.tag.warn { background: #FFF3C4; color: #6B4C00; } .tag.bad { background: var(--do-bg); color: var(--do); } .tag.info { background: #E3F2FD; color: #0D47A1; }
table { border-collapse: collapse; width: 100%; } th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13px; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: #FAFBFC; }
td.num, th.num { text-align: right; white-space: nowrap; }
.tbl-wrap { overflow-x: auto; max-width: 100%; }
tr.hl td { background: #FFFDE7; }
.matrix th[scope=row] { white-space: nowrap; font-size: 12px; }
.matrix th[scope=row] a { color: var(--ink); text-decoration: none; } .matrix th[scope=row] a:hover { text-decoration: underline; }
.chip { display: inline-flex; align-items: center; gap: 3px; font: inherit; font-size: 11px; padding: 2px 6px; border-radius: 5px; border: 1px solid transparent; margin: 2px; cursor: pointer; }
.chip.xanh { background: var(--xanh-bg); color: var(--xanh); border-color: #C8E6C9; } .chip.vang { background: var(--vang-bg); color: #6B4C00; border-color: #F5DE9B; }
.chip.do { background: var(--do-bg); color: var(--do); border-color: #FFCDD2; } .chip.xam { background: var(--xam-bg); color: #52606D; border-color: #DDE3EA; }
.chip.td { background: #fff; color: var(--muted); border-color: var(--line); }
.kcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.kcard { background: #fff; border: 1px solid var(--line); border-top: 4px solid var(--xam); border-radius: 8px; padding: 10px 12px; }
.kcard.xanh { border-top-color: var(--xanh); } .kcard.vang { border-top-color: var(--vang); } .kcard.do { border-top-color: var(--do); } .kcard.td { border-top-color: var(--td); }
.kcard .k-t { font-size: 12px; color: var(--muted); font-weight: 600; min-height: 34px; } .kcard .k-v { font-size: 22px; font-weight: 700; }
.kcard .k-s { font-size: 12px; }
ul.plain { margin: 0; padding-left: 18px; } ul.plain li { margin: 4px 0; }
.notice { padding: 10px 12px; border-radius: 8px; background: #FFF8E1; color: #5C4400; font-size: 13px; margin-bottom: 12px; }
.notice.bad { background: var(--do-bg); color: #8E1B1B; }
.chart svg { width: 100%; height: auto; display: block; } .chart text { font: 11px var(--font); fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; margin-top: 4px; } .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.tip { position: fixed; z-index: 50; max-width: 400px; background: #1F2933; color: #fff; font-size: 12px; padding: 8px 10px; border-radius: 6px; pointer-events: none; white-space: pre-line; }
.page-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.footer-note { margin-top: 24px; font-size: 11px; color: var(--muted); }
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, 1fr); } .g6 { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 820px) {
  .icon-btn { display: block; } .sidebar { position: fixed; top: 0; bottom: 0; left: 0; z-index: 30; transform: translateX(-100%); transition: transform .2s; }
  body.nav-open .sidebar { transform: none; } .g2, .g4, .g6 { grid-template-columns: 1fr; } .main { padding: 14px 16px 40px; }
}
@media print {
  @page { size: A4; margin: 12mm; }
  .topbar .controls, .sidebar, .icon-btn, .no-print { display: none !important; }
  .topbar { position: static; background: #fff; color: #000; border-bottom: 2px solid #000; } .brand small { color: #333; }
  body { background: #fff; } .card { break-inside: avoid; border-color: #999; } .main { padding: 0; }
  .g2, .g4, .g6 { grid-template-columns: 1fr 1fr; }
}

.lock { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--navy); z-index: 100; padding: 16px; }
.lock[hidden] { display: none; }
.lock-card { background: #fff; border-radius: 12px; padding: 28px 24px; width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.lock-card h1 { font-size: 20px; } .lock-card input { width: 100%; margin: 14px 0 8px; padding: 10px; font-size: 15px; }
.lock-card button { width: 100%; padding: 10px; font: inherit; font-weight: 600; border: 0; border-radius: 6px; background: var(--navy); color: #fff; cursor: pointer; }
.lock-card button:disabled { opacity: .6; } #lock-msg { min-height: 20px; font-size: 13px; color: var(--do); margin-top: 8px; }
</style>
</head>
<body>
<div id="lock" class="lock">
  <form id="lock-form" class="lock-card" autocomplete="off">
    <h1>Báo cáo quản trị BOD</h1>
    <p class="muted small">Dữ liệu đã được mã hoá. Nhập mật khẩu để xem.</p>
    <label for="lock-pw" class="small">Mật khẩu</label>
    <input id="lock-pw" type="password" required>
    <button id="lock-btn" type="submit">Mở dashboard</button>
    <div id="lock-msg" role="alert"></div>
  </form>
</div>
<div id="app" hidden>
<header class="topbar">
  <button type="button" id="nav-toggle" class="icon-btn" aria-label="Mở điều hướng" aria-expanded="false">☰</button>
  <div class="brand"><b>Báo cáo quản trị BOD</b><small id="release-name"></small></div>
  <div class="controls">
    <label>Tháng<select id="sel-ky"></select></label>
    <label>So sánh với<select id="sel-ss"></select></label>
    <span id="run-info" class="run-info"></span>
    <button type="button" id="btn-print" class="btn">In trang này</button>
  </div>
</header>
<div class="shell">
  <nav id="sidebar" class="sidebar" aria-label="Điều hướng"></nav>
  <main id="main" class="main" tabindex="-1"></main>
</div>
<div id="tip" class="tip" role="tooltip" hidden></div>
</div>

<script>
/* Dashboard quan tri BOD - khung-v1. JS thuan, khong thu vien ngoai, khong tai tai nguyen mang.
 * Du lieu: window.DASH_DATA = { phat_hanh: {...}, thang: [du-lieu.json cua cac thang da duyet] }.
 * Doc duoc schema_version 1. Them phien ban moi thi them nhanh chuyen doi trong ham chuanHoa().
 */
// khung-v2: app chi chay sau khi lock.js giai ma du lieu va goi window.startDashboard(data)
window.startDashboard = function (DATA) {
  'use strict';
  DATA = DATA || { thang: [] };
  var NHOM_THU_TU = ['Nhà máy', 'QA/QC', 'Kinh doanh', 'XNK', 'Mua hàng', 'HCNS', 'Tekla', 'NESTING'];
  var RAG_CLS = { 'Xanh': 'xanh', 'Vàng': 'vang', 'Đỏ': 'do', 'Xám': 'xam', 'Không xếp màu': 'td' };
  var MAU = { xanh: '#2E7D32', vang: '#F2A900', do: '#C62828', xam: '#9AA5B1', navy: '#1F3A5F', plan: '#9FB3C8' };
  var SERIES = ['#1F3A5F', '#2E86C1', '#E67E22', '#8E44AD', '#16A085', '#C0392B', '#7F8C8D'];
  var NHAN = { lay_cheo: 'lấy chéo', doc_anh: 'đọc ảnh', can_xac_minh: 'cần xác minh', chua_giai_trinh: 'Đơn vị chưa giải trình', vang_2_thang: 'Vàng 2 tháng liền', rag_tam: 'RAG tạm', xam: 'Xám' };

  function chuanHoa(d) {
    if (!d.schema_version || d.schema_version === 1) return d;
    return d; // schema moi hon: bo sung chuyen doi tai day
  }
  var THANG = (DATA.thang || []).map(chuanHoa).sort(function (a, b) { return a.thang < b.thang ? -1 : 1; });
  var BY = {}; THANG.forEach(function (d) { BY[d.thang] = d; });
  var KYS = THANG.map(function (d) { return d.thang; });
  var S = { ky: KYS[KYS.length - 1] || null, ss: null, tab: 'overview', kpi: null };

  // ---------- tien ich ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function nf(v, nd) {
    if (v === null || v === undefined || isNaN(v)) return '—';
    if (nd === undefined) nd = Math.abs(v) >= 1000 ? 0 : (Math.abs(v) >= 10 ? 1 : (Number.isInteger(v) ? 0 : 2));
    return Number(v).toLocaleString('vi-VN', { minimumFractionDigits: nd, maximumFractionDigits: nd });

    }).join('') + (ks.length ? '' : '<p class="muted">Không có KPI nào có số liệu thực tế.</p>') + '</div>';
    // bang KPI day du
    h += '<div class="card section"><h2>Bảng KPI đầy đủ</h2><p class="muted small">Rê chuột vào dòng để xem nguồn (file, trang/slide, cách lấy, ghi chú).</p><div class="tbl-wrap"><table><thead><tr><th>Mã</th><th>KPI</th><th>ĐVT</th><th class="num">KH</th><th class="num">TT</th><th class="num">% đạt</th><th>RAG</th><th>Căn cứ</th><th>So ' + (S.ss ? nk(S.ss) : 'tháng trước') + '</th><th>Nhãn</th></tr></thead><tbody>' +
      u.kpi.map(function (k) {
        var hl = S.kpi && S.kpi === k.ma_kpi + '|' + (k.pham_vi || '');
        return '<tr id="k-' + esc(k.ma_kpi + (k.pham_vi || '')) + '" class="' + (hl ? 'hl' : '') + '" data-tip="' + esc(nguonTxt(k)) + '"><td>' + esc(k.ma_kpi) + '</td><td>' + esc(lbl(k)) + '</td><td>' + esc(k.don_vi_tinh) + '</td><td class="num">' + nf(k.ke_hoach) + '</td><td class="num">' + nf(k.gia_tri) + '</td><td class="num">' + pf(k.ty_le_dat) + '</td><td>' + pill(k.rag) + '</td><td>' + esc(k.rag_can_cu || '') + '</td><td>' + soSanh(k, S.ss) + '</td><td>' + tags(k) + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
    // xu huong
    var opts = u.kpi.filter(function (k) { return k.gia_tri !== null; });
    var cur = opts.filter(function (k) { return S.kpi === k.ma_kpi + '|' + (k.pham_vi || ''); })[0] || opts[0];
    if (cur) {
      var sr = series(u.id, cur.ma_kpi, cur.pham_vi, S.ky);
      h += '<div class="section no-print"><label class="small">Xu hướng KPI <select id="sel-trend">' + opts.map(function (k) { var v = k.ma_kpi + '|' + (k.pham_vi || ''); return '<option value="' + esc(v) + '"' + (k === cur ? ' selected' : '') + '>' + esc(k.ma_kpi + ' ' + lbl(k)) + '</option>'; }).join('') + '</select></label></div>';
      h += '<div class="grid g2 section">' + lineChart('Xu hướng 12 tháng: ' + lbl(cur), sr.labels, [{ name: 'Thực tế', data: sr.tt, color: MAU.navy }, { name: 'Kế hoạch', data: sr.kh, color: MAU.plan, dashed: true }], cur.don_vi_tinh);
    } else { h += '<div class="grid g2 section">'; }
    // ngoai le
    var red = u.kpi.filter(function (k) { return k.rag === 'Đỏ'; });
    h += '<div class="card"><h2>Ngoại lệ (KPI Đỏ)</h2>' + (red.length ? '<ul class="plain">' + red.map(function (k) {
      var v = (u.van_de || []).filter(function (x) { return x.kpi === k.ma_kpi; })[0];
      return '<li><b>' + esc(lbl(k)) + ':</b> ' + nf(k.gia_tri) + ' / KH ' + nf(k.ke_hoach) + ' ' + esc(k.don_vi_tinh) + ' (' + pf(k.ty_le_dat) + ')<br>' +
        (v ? '<span class="small">Nguyên nhân: ' + esc(v.nguyen_nhan || 'Đơn vị chưa giải trình') + '<br>Hành động: ' + esc(v.hanh_dong || 'Đơn vị chưa nêu') + ' · Người: ' + esc(v.nguoi || 'chưa có') + ' · Hạn: ' + esc(v.han || 'chưa có') + '</span>' : '<span class="tag bad">Đơn vị chưa giải trình</span>') + '</li>';
    }).join('') + '</ul>' : '<p class="muted">Không có KPI Đỏ.</p>') + '</div></div>';
    // dac thu
    if (u.dac_thu && u.dac_thu.length) {
      h += '<h2 class="section">Nội dung đặc thù</h2><div class="grid g2">' + u.dac_thu.map(function (b) {
        if (b.loai === 'bieu_do_cot') return barChart(b.tieu_de, b.du_lieu, b.don_vi, b.nguon);
        return '<div class="card"><h3>' + esc(b.tieu_de) + '</h3><div class="tbl-wrap"><table><thead><tr>' + b.cot.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
          b.dong.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div><p class="muted small">Nguồn: ' + esc(b.nguon) + '</p></div>';
      }).join('') + '</div>';
    }
    // van de, hanh dong
    h += '<div class="card section"><h2>Vấn đề và kế hoạch hành động</h2>' + ((u.van_de || []).length ? '<div class="tbl-wrap"><table><thead><tr><th>Vấn đề</th><th>Nguyên nhân</th><th>Hành động</th><th>Người</th><th>Hạn</th><th>Trạng thái</th><th>Nguồn</th></tr></thead><tbody>' +
      u.van_de.map(function (v) { return '<tr><td>' + esc(v.van_de) + '</td><td>' + esc(v.nguyen_nhan || '—') + '</td><td>' + esc(v.hanh_dong || 'Đơn vị chưa nêu') + '</td><td>' + esc(v.nguoi || 'chưa có') + '</td><td>' + esc(v.han || 'chưa có') + '</td><td>Trích từ báo cáo</td><td class="small">' + esc(v.vt || '') + '</td></tr>'; }).join('') +
      '</tbody></table></div>' : '<p class="muted">Báo cáo không nêu vấn đề, hành động.</p>') + '</div>';
    h += '<div class="grid g2 section"><div class="card"><h2>Đề xuất</h2>' + ((u.de_xuat || []).length ? '<ul class="plain">' + u.de_xuat.map(function (p) { return '<li>' + esc(p.noi_dung || '') + '</li>'; }).join('') + '</ul>' : '<p class="muted">Đơn vị không nêu đề xuất.</p>') + '</div>' +
      '<div class="card"><h2>Chất lượng dữ liệu</h2>' + (u.chat_luong_du_lieu.length ? '<ul class="plain">' + u.chat_luong_du_lieu.map(function (c) { return '<li><span class="tag ' + (c.loai === 'Xám' ? '' : 'warn') + '">' + esc(c.loai) + '</span> ' + esc(c.mo_ta) + (c.pham_vi ? ' (' + esc(c.pham_vi) + ')' : '') + '</li>'; }).join('') + '</ul>' : '<p class="muted">Không có cảnh báo.</p>') +
      '<p class="muted small">CH-02 đóng hành động đúng hạn: ' + esc(u.ch02 ? u.ch02.rag + ' (' + u.ch02.ly_do + ')' : '—') + '</p></div></div>';
    main.innerHTML = h;
    if (S.kpi) { var el = document.getElementById('k-' + S.kpi.replace('|', '')); if (el) el.scrollIntoView({ block: 'center' }); }
  }

  function render() {
    readHash(); topbar(); sidebar();
    if (!S.ky) { main.innerHTML = '<div class="notice">Bản phát hành không có dữ liệu tháng nào.</div>'; return; }
    if (S.tab === 'overview') overview(); else unitPage(S.tab);
    document.body.classList.remove('nav-open');
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]'); if (b) { go(b.getAttribute('data-go'), b.getAttribute('data-kpi')); return; }
    if (e.target.id === 'btn-print') window.print();
    if (e.target.id === 'nav-toggle') { var o = document.body.classList.toggle('nav-open'); e.target.setAttribute('aria-expanded', o); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'sel-ky') { S.ky = e.target.value; S.ss = prevKy(S.ky); go(S.tab); }
    else if (e.target.id === 'sel-ss') { S.ss = e.target.value || null; go(S.tab, S.kpi); }
    else if (e.target.id === 'sel-trend') { go(S.tab, e.target.value); }
  });
  window.addEventListener('hashchange', render);
  render();
};

</script>
<script>
/* Man hinh khoa: giai ma du lieu AES-256-GCM bang Web Crypto API (khong thu vien ngoai).
 * window.ENC = { v, kdf:'PBKDF2-SHA256', iter, salt, iv, ct } (base64). Khoa = PBKDF2(mat khau, salt, iter) -> AES-GCM 256.
 */
(function () {
  'use strict';
  var E = window.ENC, KEY = 'dash_pw_session';
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  async function decrypt(pw) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(E.salt), iterations: E.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(E.iv) }, key, b64(E.ct));
    return JSON.parse(new TextDecoder().decode(buf));
  }
  var box = document.getElementById('lock'), form = document.getElementById('lock-form'), inp = document.getElementById('lock-pw'), msg = document.getElementById('lock-msg'), btn = document.getElementById('lock-btn');
  async function tryOpen(pw, silent) {
    btn.disabled = true; msg.textContent = 'Đang giải mã…';
    try {
      var data = await decrypt(pw);
      try { sessionStorage.setItem(KEY, pw); } catch (e) {}
      box.hidden = true; document.getElementById('app').hidden = false;
      window.startDashboard(data);
    } catch (e) {
      try { sessionStorage.removeItem(KEY); } catch (x) {}
      msg.textContent = silent ? '' : 'Sai mật khẩu hoặc dữ liệu hỏng. Vui lòng thử lại.';
      btn.disabled = false; inp.value = ''; inp.focus();
    }
  }
  if (!window.crypto || !crypto.subtle) { msg.textContent = 'Trình duyệt không hỗ trợ giải mã (cần mở qua https hoặc file trên Edge/Chrome mới).'; btn.disabled = true; return; }
  form.addEventListener('submit', function (e) { e.preventDefault(); if (inp.value) tryOpen(inp.value, false); });
  var saved = null; try { saved = sessionStorage.getItem(KEY); } catch (e) {}
  if (saved) tryOpen(saved, true); else inp.focus();
})();

</script>
