<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard quản trị BOD</title>
<style>
/* khung-v5: = khung-v4 (he mau semantic, drawer, 5 khoi) + co "Lech doi soat" cho schema 2 */
:root {
  --navy: #1F3A5F; --navy-2: #2C5282; --ink: #1F2933; --muted: #616E7C; --line: #D9E2EC; --line-2: #EDF1F5; --bg: #F4F6F8; --card: #FFFFFF;
  /* Semantic: mau chu dam tren nen nhat, tuong phan >= 4.5:1 */
  --ok: #1E7B4F;   --ok-bg: #E7F4EC;   --ok-bd: #BFE3CC;
  --warn: #8A5300; --warn-bg: #FDF3E1; --warn-bd: #F1D49B; --warn-mark: #D69E2E;
  --bad: #B42318;  --bad-bg: #FDECEA;  --bad-bd: #F6C6C0;
  --info: #1D4E89; --info-bg: #E8EFF7; --info-bd: #C3D5EA;
  --calc: #475569; --calc-bg: #F8FAFC; --calc-bd: #CBD5E1;
  --gray: #52606D; --gray-bg: #EEF1F4; --gray-bd: #D5DCE3; --gray-mark: #9AA5B1;
  --r: 10px; --sh: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 14px/1.5 var(--font); color: var(--ink); background: var(--bg); }
h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 16px; margin: 0 0 8px; } h3 { font-size: 14px; margin: 0 0 6px; }
.muted { color: var(--muted); } .small { font-size: 12px; }
a { color: var(--navy-2); }

/* ---------- thanh tren, dieu huong ---------- */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--navy); color: #fff; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; margin-right: auto; } .brand small { color: #C8D6E5; font-size: 12px; }
.controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.controls label { display: flex; flex-direction: column; font-size: 11px; color: #C8D6E5; }
select, input { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
.run-info { font-size: 12px; color: #E3EAF2; max-width: 380px; }
.btn { font: inherit; font-size: 12px; padding: 6px 10px; border-radius: 6px; border: 1px solid #fff; background: transparent; color: #fff; cursor: pointer; }
.icon-btn { display: none; font-size: 20px; background: transparent; border: 0; color: #fff; cursor: pointer; }
.shell { display: flex; min-height: calc(100vh - 60px); }
.sidebar { width: 280px; flex: 0 0 280px; background: #fff; border-right: 1px solid var(--line); padding: 10px 8px; overflow-y: auto; }
.nav-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 13px; }
.nav-item:hover { background: var(--bg); } .nav-item.active { background: var(--info-bg); font-weight: 600; }
.nav-item .n { margin-left: auto; font-size: 11px; color: var(--bad); font-weight: 700; }
.nav-group { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 12px 10px 4px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 9px; background: var(--gray-mark); }
.dot.do { background: var(--bad); } .dot.vang { background: var(--warn-mark); } .dot.xanh { background: var(--ok); }
.main { flex: 1; padding: 18px 20px 40px; min-width: 0; }

/* ---------- bo cuc ---------- */
.grid { display: grid; gap: 14px; } .g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: repeat(3, 1fr); } .g6 { grid-template-columns: repeat(6, 1fr); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; box-shadow: var(--sh); }
.section { margin-top: 14px; }
.page-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.footer-note { margin-top: 24px; font-size: 11px; color: var(--muted); }

/* Khoi danh so 1..5 cua trang don vi */
.block { margin-top: 18px; }
.block-h { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
.block-h .no { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 13px; font-weight: 700; flex: 0 0 26px; }
.block-h h2 { margin: 0; font-size: 17px; }
.block-plan { border: 2px solid var(--info-bd); background: linear-gradient(180deg, var(--info-bg) 0, #fff 70px); border-radius: 12px; padding: 16px; }
.block-plan .block-h .no { background: var(--info); }
/* Overview: the so, thanh phan bo mau theo nhom, so sanh don vi, vong hoan thanh */
.g4 { grid-template-columns: repeat(4, 1fr); }
.stat b small { font-size: 15px; color: var(--muted); font-weight: 600; }
.stat em { display: block; font-style: normal; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.s-xanh { background: var(--ok); } .s-vang { background: var(--warn-mark); } .s-do { background: var(--bad); } .s-xam { background: var(--gray-mark); } .s-td { background: var(--info-bd); }
.legend i.s-xanh, .legend i.s-vang, .legend i.s-do, .legend i.s-xam, .legend i.s-td { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.stk-row { display: grid; grid-template-columns: 110px 1fr 36px; gap: 8px; align-items: center; margin: 6px 0; font-size: 12.5px; }
.stk-row.stk-total { border-top: 1px solid var(--line); padding-top: 8px; font-weight: 700; }
.stk-bar { display: flex; height: 22px; border-radius: 5px; overflow: hidden; background: var(--gray-bg); }
.stk-seg { border: 0; padding: 0; color: #fff; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer; min-width: 16px; text-shadow: 0 1px 1px rgba(0,0,0,.25); }
.stk-seg.s-td, .stk-seg.s-xam { color: #1F2933; text-shadow: none; }
.stk-seg:hover { filter: brightness(1.08); } .stk-seg.dim, .chip.dim { opacity: .28; }
.stk-n { text-align: right; color: var(--muted); }
.pb-row { display: grid; grid-template-columns: minmax(120px, 42%) 1fr 92px; gap: 8px; align-items: center; padding: 5px 4px; border-radius: 6px; font-size: 12.5px; cursor: pointer; }
.pb-row:hover, .pb-row:focus { background: var(--info-bg); outline: none; }
.pb-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pb-bar { height: 14px; background: var(--gray-bg); border-radius: 4px; overflow: hidden; display: flex; align-items: center; }
.pb-bar .muted { padding-left: 6px; font-size: 11px; }
.pb-f { display: block; height: 100%; border-radius: 4px; }
.pb-v { text-align: right; font-weight: 700; }
.donut { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.donut svg { width: 170px; height: 170px; flex: 0 0 170px; }
.donut .d-c { font: 700 20px var(--font); fill: var(--ink); } .donut .d-s { font: 11px var(--font); fill: var(--muted); }
.d-leg { list-style: none; margin: 0; padding: 0; font-size: 13px; flex: 1; min-width: 180px; }
.d-leg li { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line-2); }
.d-leg i { width: 11px; height: 11px; border-radius: 3px; flex: 0 0 11px; } .d-leg b { margin-left: auto; }
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 820px) { .g4 { grid-template-columns: 1fr 1fr; } .pb-row { grid-template-columns: 1fr 70px; } .pb-row .pb-bar { grid-column: 1 / -1; grid-row: 2; } }
/* Khoi 5: danh sach dau viec dang the phang, doc luot */
.viec-list { list-style: none; margin: 0; padding: 0; }
.viec-item { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line-2); border-left: 3px solid var(--info-bd); background: #fff; }
.viec-item + .viec-item { margin-top: 6px; }
.viec-item:last-child { border-bottom: 0; }
.viec-item:hover { background: var(--info-bg); }
.viec-item.clickable { cursor: pointer; } .viec-item.clickable:focus-visible { outline: 2px solid var(--info-bd); outline-offset: 1px; }
.viec-go { color: #94A3B8; font-size: 15px; margin-left: 6px; transition: transform .15s, color .15s; } .viec-item:hover .viec-go { color: #1E40AF; transform: translateX(2px); }
.viec-title { font-weight: 700; color: var(--ink); line-height: 1.4; }
.viec-desc { font-size: 12.5px; font-style: italic; color: var(--muted); margin-top: 2px; line-height: 1.45; }
.viec-meta { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: flex-end; flex: 0 0 auto; max-width: 40%; }
.info-i { cursor: help; font-size: 14px; line-height: 1; opacity: .75; padding: 2px; border-radius: 4px; }
.info-i:hover, .info-i:focus { opacity: 1; outline: 2px solid var(--info-bd); }
@media (max-width: 820px) { .viec-item { flex-direction: column; } .viec-meta { max-width: none; justify-content: flex-start; } }
/* Bieu do cot */
.chart text.c-lbl { font-size: 12px; font-weight: 600; fill: #475569; } .chart text.c-lbl.c-hot { fill: #B45309; }
.chart .c-sub { margin: -4px 0 8px; font-size: 12px; color: #64748B; }
.chart .hit { fill: transparent; cursor: crosshair; } .chart .hit:hover { fill: rgba(30, 64, 175, .05); }
.legend i.lg-dot { border-radius: 50%; }
.legend .lg-line { display: inline-block; width: 20px; height: 0; border-top: 2px dashed; margin-right: 6px; vertical-align: 3px; }
/* Van de va ke hoach hanh dong: bang 3 cot gon, chuan BOD */
.vd-tbl { table-layout: fixed; }
.vd-tbl th { background: var(--info-bg); color: var(--info); padding: 10px 14px; border-bottom: 1px solid var(--info-bd); }
.vd-tbl td { font-size: 13px; padding: 14px; border-bottom: 1px solid #eef2f6; vertical-align: top; line-height: 1.5; }
.vd-tbl tr:last-child td { border-bottom: 0; }
.vd-tbl .vd-c1 { width: 35%; } .vd-tbl .vd-c2 { width: 35%; } .vd-tbl .vd-c3 { width: 30%; } .vd-tbl .vd-go { width: 32px; padding-left: 0; padding-right: 8px; text-align: right; }
.vd-tbl tr.clickable td:first-child, .vd-tbl tr.clickable:hover td:first-child { box-shadow: none; }
.vd-tbl tr.clickable:hover td { background: #F5F8FC; }
.vd-tbl td.vd-go span { color: var(--muted); font-size: 15px; transition: transform .12s, color .12s; display: inline-block; }
.vd-tbl tr.clickable:hover td.vd-go span { color: var(--info); transform: translateX(2px); }
.vd-tbl .vd-title { font-weight: 600; color: var(--ink); line-height: 1.45; }
.vd-tbl .vd-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.vd-clean { list-style: none; margin: 0; padding: 0; }
.vd-clean li { margin: 0; line-height: 1.5; color: var(--ink); }
.vd-clean li + li { margin-top: 6px; }
.vd-c1 .vd-clean { margin-top: 4px; } .vd-c1 .vd-clean li { color: var(--muted); font-size: 12.5px; }
.tag.vd-b-do { background: var(--bad-bg); color: var(--bad); border-color: var(--bad-bd); }
.tag.vd-b-vang { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-bd); }
.tag.vd-b-xanh { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-bd); }
.tag.vd-b-xam, .tag.vd-b-td { background: var(--gray-bg); color: var(--gray); border-color: var(--gray-bd); }
.tag.vd-empty { background: #F5F7FA; color: var(--muted); border-color: var(--line); font-weight: 600; }
.tag.vd-empty.warn-l { background: #FFF8E6; color: #8A5300; border-color: #F3DDA8; }
@media (max-width: 820px) { .vd-tbl { table-layout: auto; } .vd-tbl td { padding: 10px; } }
.vd-list { list-style: none; margin: 0; padding: 0; }
.vd-item { padding: 10px 12px; border: 1px solid var(--line-2); border-left: 3px solid var(--info-bd); border-radius: 6px; background: #fff; cursor: pointer; }
.vd-item + .vd-item { margin-top: 8px; }
.vd-item.lv-do { border-left-color: var(--bad); } .vd-item.lv-vang { border-left-color: var(--warn-mark); }
.vd-item:hover, .vd-item:focus { background: var(--info-bg); outline: none; }
.vd-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.vd-title { font-weight: 700; color: var(--ink); line-height: 1.4; }
.vd-desc { font-size: 12.5px; color: var(--ink); margin-top: 2px; line-height: 1.45; }
.vd-body { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line-2); }
.vd-lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 3px; }
.vd-pts { margin: 0; padding-left: 16px; font-size: 12.5px; line-height: 1.5; color: var(--ink); }
.vd-pts li { margin: 2px 0; }
.vd-none { font-size: 12.5px; font-style: italic; color: var(--muted); }
.vd-item.lv-do .vd-none, .vd-tbl tr.r-do .vd-none { color: var(--bad); font-style: normal; font-weight: 600; }
@media (max-width: 820px) { .vd-head { flex-direction: column; } .vd-body { grid-template-columns: 1fr; } }
.placeholder { padding: 12px 14px; border: 1px dashed var(--gray-bd); border-radius: 8px; background: #FAFBFC; color: var(--gray); font-size: 13px; }

/* ---------- the so lieu ---------- */
.stat b { font-size: 26px; display: block; } .stat span { color: var(--muted); font-size: 12px; }
.stat { border-left: 4px solid var(--line); }
.stat.xanh { border-left-color: var(--ok); background: var(--ok-bg); } .stat.xanh b { color: var(--ok); }
.stat.vang { border-left-color: var(--warn-mark); background: var(--warn-bg); } .stat.vang b { color: var(--warn); }
.stat.do { border-left-color: var(--bad); background: var(--bad-bg); } .stat.do b { color: var(--bad); }
.stat.xam { border-left-color: var(--gray-mark); background: var(--gray-bg); } .stat.xam b { color: var(--gray); }
.stat.td { border-left-color: var(--info-bd); background: var(--info-bg); } .stat.td b { color: var(--info); }

/* ---------- badge trang thai ---------- */
.pill { display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.p-xanh { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-bd); }
.p-vang { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-bd); }
.p-do { background: var(--bad-bg); color: var(--bad); border-color: var(--bad-bd); }
.p-xam { background: var(--gray-bg); color: var(--gray); border-color: var(--gray-bd); }
.p-td { background: var(--info-bg); color: var(--info); border-color: var(--info-bd); }
td .pill { min-width: 58px; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 5px; background: var(--gray-bg); color: var(--gray); margin: 1px 3px 1px 0; white-space: nowrap; border: 1px solid var(--gray-bd); }
.tag.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-bd); }
.tag.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-bd); }
.tag.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad-bd); }
.tag.info { background: var(--info-bg); color: var(--info); border-color: var(--info-bd); }
.tag.calc { background: var(--calc-bg); color: var(--calc); border-color: var(--calc-bd); }
.tag.dashed { border-style: dashed; }

/* ---------- bang ---------- */
table { border-collapse: collapse; width: 100%; } th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13px; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: #FAFBFC; }
td.num, th.num { text-align: right; white-space: nowrap; }
.tbl-wrap { overflow-x: auto; max-width: 100%; }
tr.clickable { cursor: pointer; transition: background .12s; }
tr.clickable:hover td, tr.clickable:focus td { background: var(--info-bg); }
tr.clickable:focus { outline: 2px solid var(--info); outline-offset: -2px; }
tr.clickable td:first-child { box-shadow: inset 3px 0 0 transparent; }
tr.clickable:hover td:first-child { box-shadow: inset 3px 0 0 var(--info); }
tr.r-do td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
tr.r-vang td:first-child { box-shadow: inset 3px 0 0 var(--warn-mark); }
tr.hl td { background: #FFFBEA; }
.row-go { color: var(--info); font-size: 12px; white-space: nowrap; }
.matrix th[scope=row] { white-space: nowrap; font-size: 12px; }
.matrix th[scope=row] a { color: var(--ink); text-decoration: none; } .matrix th[scope=row] a:hover { text-decoration: underline; }
.chip { display: inline-flex; align-items: center; gap: 3px; font: inherit; font-size: 11px; padding: 2px 6px; border-radius: 5px; border: 1px solid transparent; margin: 2px; cursor: pointer; }
.chip.xanh { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-bd); }
.chip.vang { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-bd); }
.chip.do { background: var(--bad-bg); color: var(--bad); border-color: var(--bad-bd); }
.chip.xam { background: var(--gray-bg); color: var(--gray); border-color: var(--gray-bd); }
.chip.td { background: var(--info-bg); color: var(--info); border-color: var(--info-bd); }
.chip:hover { filter: brightness(.96); box-shadow: 0 0 0 1px rgba(31, 58, 95, .3); }

/* ---------- the KPI ---------- */
.kcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.kcard { text-align: left; font: inherit; color: inherit; background: #fff; border: 1px solid var(--line); border-top: 4px solid var(--gray-mark); border-radius: 8px; padding: 10px 12px; cursor: pointer; box-shadow: var(--sh); transition: transform .12s, box-shadow .12s; }
.kcard:hover, .kcard:focus { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(16, 24, 40, .12); outline: none; }
.kcard.xanh { border-top-color: var(--ok); }
.kcard.vang { border-top-color: var(--warn-mark); }
.kcard.do { border-top-color: var(--bad); }
.kcard.xam { background: linear-gradient(180deg, var(--gray-bg) 0, #fff 46px); }
.kcard.td { border-top-color: var(--info-bd); }
.kcard .k-t { font-size: 12px; color: var(--muted); font-weight: 600; min-height: 34px; }
.kcard .k-v { font-size: 22px; font-weight: 700; }
.kcard.xanh .k-v { color: var(--ok); } .kcard.vang .k-v { color: var(--warn); } .kcard.do .k-v { color: var(--bad); }
.kcard .k-s { font-size: 12px; }

/* ---------- khac ---------- */
ul.plain { margin: 0; padding-left: 18px; } ul.plain li { margin: 4px 0; }
.notice { padding: 10px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); font-size: 13px; margin-bottom: 12px; border: 1px solid var(--warn-bd); }
.notice.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad-bd); }
.notice.info { background: var(--info-bg); color: var(--info); border-color: var(--info-bd); }
.chart svg { width: 100%; height: auto; display: block; } .chart text { font: 12px Inter, Roboto, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #64748B; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font: 12px Inter, Roboto, "Segoe UI", Arial, sans-serif; color: #64748B; margin-top: 6px; } .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.tip { position: fixed; z-index: 70; max-width: 360px; background: rgba(15, 23, 42, .9); color: #F8FAFC; font: 12px/1.55 Inter, Roboto, "Segoe UI", Arial, sans-serif; padding: 9px 12px; border-radius: 8px; box-shadow: 0 10px 28px rgba(15, 23, 42, .28); backdrop-filter: blur(4px); pointer-events: none; white-space: pre-line; }
.tip::first-line { font-weight: 600; color: #fff; }
.perf { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------- ngan chi tiet (drawer) ---------- */
.drawer { position: fixed; inset: 0; z-index: 60; }
.drawer-bg { position: absolute; inset: 0; background: rgba(15, 23, 42, .38); }
.drawer-panel { position: absolute; right: 0; top: 0; bottom: 0; width: min(600px, 100%); background: #fff; overflow: auto; padding: 18px 22px 40px; box-shadow: -8px 0 30px rgba(0, 0, 0, .2); }
.close-btn { position: absolute; right: 12px; top: 10px; font-size: 18px; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px 8px; border-radius: 6px; }
.close-btn:hover { background: var(--gray-bg); }
body.drawer-open { overflow: hidden; }
.dr-crumb { font-size: 12px; color: var(--muted); padding-right: 36px; }
.dr-title { font-size: 19px; margin: 2px 0 8px; padding-right: 36px; }
.dr-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 12px; }
.dr-sec { border-top: 1px solid var(--line-2); padding: 12px 0 4px; }

<script>
/* Dashboard quan tri BOD - khung-v5 (= khung-v4 + co "Lech doi soat" va doc day du schema 2 cua tinh_toan_v2.py).
 * Sua tai cho 21/11/2026 theo yeu cau nguoi dung (khung-v5 chua phat hanh chinh thuc, khong tao khung-v6):
 *   khoi 5 khong lap bang ke hoach cua noi dung dac thu khi da co muc_tieu_thang_sau; so tien ty dong hien thanh so dong day du;
 *   dau viec trong tam dang the: tieu de dam + mo ta, badge thoi gian; nguon xem trong ngan chi tiet (khong dung icon).
 * Sua tai cho lan 3 (21/11/2026): Overview theo bo cuc ban demo (the so, KPI theo nhom co loc ma tran, so sanh don vi, hoan thanh, van de & kien nghi);
 *   tab don vi con 3 khoi (KPI, Van de ton dong & Kien nghi, Muc tieu thang moi); bo khoi "Hanh dong qua han" va moi nhac bieu mau VAN_DE_HANH_DONG.
 * Ban ma hoa: index_ma_hoa.html + lock.js (lop giai ma goi startDashboard(data)).
 * JS thuan, khong thu vien ngoai, khong tai tai nguyen mang.
 * Khoi dong: window.startDashboard(DATA), DATA = { phat_hanh: {...}, thang: [du-lieu.json cac thang da duyet] }.
 *   Ban thuong: index.html goi startDashboard(window.DASH_DATA). Ban ma hoa (sau nay): lop giai ma goi startDashboard(data).
 * Schema 2 (CLAUDE.md muc 7A): gia_tri = so bao cao (neu co) va % dat, RAG tinh theo so do; gia_tri_doi_soat chi de doi soat.
 *   kpi: gia_tri_bao_cao, gia_tri_bao_cao_txt, vi_tri_bao_cao, nhan_bao_cao, gia_tri_doi_soat, lech_doi_soat, co_lech_doi_soat,
 *        nguon_gia_tri ('bao_cao' | 'tinh'), cong_thuc, kh_nguon, danh_gia_don_vi
 *   don_vi: khoi_thieu {ten_khoi: ly_do}
 * Schema 1 (T09, T10/2026): so bao cao doc nguyen van tu ghi_chu; % dat, RAG cua ban da duyet tinh theo so he thong.
 * Truong schema 2 (don vi):
 *   don_vi: danh_gia_hieu_suat {noi_dung, nguon}, cong_viec_hoan_thanh [{noi_dung, trang_thai, nguon}],
 *           muc_tieu_thang_sau [{chi_so, ke_hoach, don_vi_tinh, nguon}], viec_trong_tam_thang_sau [{noi_dung, nguoi, han, nguon}]
 * Voi schema 1, cac truong tren duoc DOC NGUYEN VAN tu ghi_chu da duyet (khong tinh lai, khong suy doan).
 * Nguyen tac hien thi (nguoi dung chot 21/11/2026):
 *   - Chi so bao cao da ghi so: hien so bao cao lam so chinh; so he thong dat trong ngan chi tiet "Hệ thống kiểm tra".
 *   - So phai sinh: nhan [Số tính toán], ngan chi tiet hien cong thuc va nguon.
 *   - % dat, RAG: lay nguyen tu du lieu da duyet; ngan chi tiet ghi "Đánh giá tự động: TT / KH".
 *   - Quy doi don vi: ngan chi tiet ghi so goc.
 *   - Dashboard KHONG tinh KPI, % dat hay mau RAG.
 */
window.startDashboard = function (DATA) {
  'use strict';
  DATA = DATA || { thang: [] };
  var NHOM_THU_TU = ['Nhà máy', 'QA/QC', 'Kinh doanh', 'XNK', 'Mua hàng', 'HCNS', 'Tekla', 'NESTING'];
  var RAG_CLS = { 'Xanh': 'xanh', 'Vàng': 'vang', 'Đỏ': 'do', 'Xám': 'xam', 'Không xếp màu': 'td', 'Chưa giao KH': 'nokh' };
  // Nhom hien thi (nguoi dung yeu cau 21/11/2026): KPI Xam vi chua co KH nhung CO so thuc te hien 'Chua giao KH' (trung tinh);
  // KPI chi theo doi (TD) goi la 'Tham chieu'. Mau RAG trong du lieu khong doi, dashboard chi doi cach goi va dem.
  function nhomHT(k) { return k.rag === 'Xám' && k.gia_tri !== null && k.gia_tri !== undefined && /kế hoạch/.test(k.ly_do_xam || '') ? 'Chưa giao KH' : k.rag; }
  var TEN_HT = { 'Không xếp màu': 'Tham chiếu', 'Xám': 'Xám (thiếu số)' };
  function tenHT(r) { return TEN_HT[r] || r; }
  var MAU = { ok: '#1E7B4F', warn: '#D69E2E', bad: '#B42318', gray: '#9AA5B1', navy: '#1F3A5F', plan: '#8FA9C6' };
  var SERIES = ['#1F3A5F', '#2E86C1', '#D97706', '#7C3AED', '#0F766E', '#B42318', '#6B7280'];
  var NHAN = { lay_cheo: 'lấy chéo', doc_anh: 'đọc ảnh', can_xac_minh: 'cần xác minh', chua_giai_trinh: 'Cần đơn vị giải trình', vang_2_thang: 'Vàng 2 tháng liền', rag_tam: 'RAG tạm', xam: 'Xám' };
  var CACH_LAY = { 'excel-chuan': 'Excel chuẩn của đơn vị', chu: 'chữ trong báo cáo', 'bieu-do': 'dữ liệu gốc của biểu đồ', anh: 'đọc ảnh', excel: 'file Excel của đơn vị', 'lay-cheo': 'lấy chéo từ đơn vị khác', tinh: 'tính từ các số thành phần' };
  var CHIEU = { up: 'Càng cao càng tốt', down: 'Càng thấp càng tốt', zero: 'Mục tiêu bằng 0', td: 'Chỉ theo dõi' };

  function chuanHoa(d) {
    var sv = d.schema_version || 1;
    (d.don_vi || []).forEach(function (u) { (u.kpi || []).forEach(function (k) { k._sv = sv; }); });
    return d; // schema moi hon 2: bo sung chuyen doi tai day
  }
  var THANG = (DATA.thang || []).map(chuanHoa).sort(function (a, b) { return a.thang < b.thang ? -1 : 1; });
  var BY = {}; THANG.forEach(function (d) { BY[d.thang] = d; });
  var KYS = THANG.map(function (d) { return d.thang; });
  var S = { ky: KYS[KYS.length - 1] || null, ss: null, tab: 'overview', sel: null, trend: {} };
  var lastSig = null, keepScroll = false;

  // ---------- tien ich ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function nf(v, nd) {
    if (v === null || v === undefined || isNaN(v)) return '—';
    if (nd === undefined) nd = Math.abs(v) >= 1000 ? 0 : (Math.abs(v) >= 10 ? 1 : (Number.isInteger(v) ? 0 : 2));
    return Number(v).toLocaleString('vi-VN', { minimumFractionDigits: nd, maximumFractionDigits: nd });
  }
  function full(v) { return v === null || v === undefined || isNaN(v) ? '—' : Number(v).toLocaleString('vi-VN', { maximumFractionDigits: 6 }); }
  function pyRound1(x) { // giong round(x, 1) cua Python de PowerPoint va Dashboard hien cung mot so
    var s = Math.abs(x).toFixed(20), m = /^(\d+)\.(\d)5(0+)$/.exec(s);
    if (m) { var t = Number(m[1] + m[2]) + (Number(m[2]) % 2 ? 1 : 0); return (x < 0 ? -1 : 1) * t / 10; }
    return Number(x.toFixed(1));
  }
  function pf(p) { return p === null || p === undefined ? '—' : nf(pyRound1(p * 100), 1) + '%'; }
  function nk(ky) { return ky ? 'T' + ky.slice(5) + '/' + ky.slice(0, 4) : '—'; }
  function fd(d) { return d ? d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(0, 4) : '—'; }
  function prevKy(ky) { var i = KYS.indexOf(ky); return i > 0 ? KYS[i - 1] : null; }
  function nextKyOf(ky) { var y = +ky.slice(0, 4), m = +ky.slice(5) + 1; if (m > 12) { m = 1; y++; } return y + '-' + (m < 10 ? '0' : '') + m; }
  function cls(r) { return RAG_CLS[r] || 'xam'; }
  function pill(r) { return '<span class="pill p-' + cls(r) + '">' + esc(r === 'Không xếp màu' ? 'Tham chiếu' : r) + '</span>'; }
  function pillK(k) { return pill(nhomHT(k)); }
  function lbl(k) { return k.chi_so + (k.pham_vi ? ' (' + k.pham_vi + ')' : ''); }
  function keyOf(k) { return k.ma_kpi + '|' + (k.pham_vi || ''); }
  function unit(ky, id) { var d = BY[ky]; if (!d) return null; for (var i = 0; i < d.don_vi.length; i++) if (d.don_vi[i].id === id) return d.don_vi[i]; return null; }
  function kpiOf(ky, id, ma, pv) { var u = unit(ky, id); if (!u) return null; for (var i = 0; i < u.kpi.length; i++) { var k = u.kpi[i]; if (k.ma_kpi === ma && (k.pham_vi || '') === (pv || '')) return k; } return null; }
  function soVN(t) { return Number(String(t).replace(/\./g, '').replace(',', '.')); }
  function soThapPhan(t) { var m = /,(\d+)$/.exec(String(t)); return m ? m[1].length : 0; }

  // Doc nguyen van cac thanh phan trong ghi_chu da duyet (schema 1). Khong tinh lai so nao.
  var META = typeof WeakMap === 'function' ? new WeakMap() : null;
  function meta(k) {
    if (META && META.has(k)) return META.get(k);
    var g = k.ghi_chu || '', m, r = {};
    r.cong_thuc = k.cong_thuc || ((m = /Công thức: ([^;]+)/.exec(g)) ? m[1].trim() : null);
    r.kh_nguon = k.kh_nguon || ((m = /(?:^|; )KH: ([^;]+)/.exec(g)) ? m[1].trim() : null);
    if (k._sv >= 2) {
      // schema 2: co ca so bao cao va so doi soat thi moi hien phan doi soat; RAG theo so bao cao
      if (k.gia_tri_bao_cao !== null && k.gia_tri_bao_cao !== undefined && k.gia_tri_doi_soat !== null && k.gia_tri_doi_soat !== undefined) {
        var tx = k.gia_tri_bao_cao_txt || nf(k.gia_tri_bao_cao);
        r.bao_cao = { nhan: k.nhan_bao_cao || 'Báo cáo ghi', txt: tx, so: k.gia_tri_bao_cao, nd: soThapPhan(tx), doi_soat: k.gia_tri_doi_soat,
          lech: k.lech_doi_soat, co_lech: !!k.co_lech_doi_soat, rag_theo: 'bao_cao', vt: k.vi_tri_bao_cao };
      } else r.bao_cao = null;
      r.la_so_tinh = k.nguon_gia_tri === 'tinh';
    } else {
      // schema 1: doc nguyen van "Bao cao ghi ... X; tinh theo cong thuc ... ra Y" trong ghi_chu; RAG ban da duyet theo so he thong
      if ((m = /Báo cáo ghi (.+?) ([\d.]*\d(?:,\d+)?); tính theo công thức[^;]*? ra ([\d.]*\d(?:,\d+)?)/.exec(g))) {
        var so = soVN(m[2]), nd = soThapPhan(m[2]), le = k.gia_tri - so;
        r.bao_cao = { nhan: m[1], txt: m[2], so: so, nd: nd, doi_soat: k.gia_tri, lech: le, co_lech: Math.abs(le) > 0.5 * Math.pow(10, -nd) + 1e-9, rag_theo: 'he_thong', vt: k.trang_slide };
      } else r.bao_cao = null;
      r.la_so_tinh = !r.bao_cao && (k.cach_lay === 'tinh' || !!r.cong_thuc);
    }
    r.quy_doi = k.don_vi_goc && k.don_vi_goc !== k.don_vi_tinh && k.gia_tri_goc !== null && k.gia_tri_goc !== undefined;
    if (META) META.set(k, r);
    return r;
  }
  function lechTxt(b) { var t = nf(Math.abs(b.lech), b.nd); return (/[1-9]/.test(t) ? (b.lech > 0 ? '+' : '-') : '') + t; }
  function soHienThi(k) { var b = meta(k).bao_cao; return b ? b.so : k.gia_tri; } // so dang hien thi (dung cho mui ten so sanh)
  function hienThi(k) { // so hien thi chinh
    var mt = meta(k);
    if (mt.bao_cao) return esc(mt.bao_cao.txt);

    h += '<div class="dr-sec"><h3>Giá trị</h3><div class="big">' + hienThi(k) + ' <span class="small muted">' + esc(k.don_vi_tinh) + '</span></div>';
    if (mt.bao_cao) {
      var bcx = mt.bao_cao;
      h += '<p class="small" style="margin:4px 0">Số đơn vị báo cáo (' + esc(bcx.nhan) + (bcx.vt ? ', ' + esc(bcx.vt) : '') + '), hiển thị chính.</p>' +
        '<div class="box ' + (bcx.co_lech ? 'warn' : 'info') + ' mono">[Hệ thống kiểm tra: ' + nf(bcx.doi_soat, bcx.nd) + ' (Lệch: ' + lechTxt(bcx) + ')]' +
        (bcx.co_lech ? ' ⚠️ Lệch đối soát' : ' Khớp trong sai số làm tròn') + '</div>' +
        (mt.cong_thuc ? '<p class="small">Công thức đối soát: <span class="mono">' + esc(mt.cong_thuc) + '</span></p>' : '') +
        (bcx.rag_theo === 'bao_cao'
          ? '<p class="small muted">% đạt và màu RAG tính theo số báo cáo ' + esc(bcx.txt) + '. Số hệ thống chỉ để đối soát, không đổi màu.</p>'
          : '<p class="small muted">% đạt và màu RAG trong bản đã duyệt đang tính theo số hệ thống ' + nf(bcx.doi_soat, bcx.nd) + ' (dữ liệu trước quy tắc ưu tiên số báo cáo từ T11/2026).</p>');
    }
    if (mt.quy_doi) h += '<div class="box info">Hiển thị: ' + nf(k.gia_tri) + ' ' + esc(k.don_vi_tinh) + ' (Số gốc: ' + full(k.gia_tri_goc) + ' ' + esc(k.don_vi_goc) + ')</div>';
    else if (k.gia_tri !== null && !mt.bao_cao && nf(k.gia_tri) !== full(k.gia_tri)) h += '<p class="small muted">Giá trị đầy đủ trong dữ liệu: ' + full(k.gia_tri) + ' ' + esc(k.don_vi_tinh) + '</p>';
    if (k.gia_tri === null) h += '<div class="box">Không có số thực tế. ' + esc(k.ly_do_xam || '') + '</div>';
    h += '</div>';
    // So tinh toan
    if (mt.la_so_tinh) h += '<div class="dr-sec"><h3>Số tính toán</h3><div class="box calc">[Số tính toán] ' + (mt.cong_thuc ? 'Công thức: <span class="mono">' + esc(mt.cong_thuc) + '</span>' : 'Tính theo định nghĩa KPI; dữ liệu đã duyệt không ghi công thức chi tiết, xem ghi chú bên dưới.') + '</div></div>';
    // Danh gia
    h += '<div class="dr-sec"><h3>Đánh giá</h3>' + kv([
      ['Kế hoạch', k.ke_hoach !== null && k.ke_hoach !== undefined ? full(k.ke_hoach) + ' ' + esc(k.don_vi_tinh) : '—'],
      ['Nguồn kế hoạch', esc(mt.kh_nguon || '—')],
      ['% đạt', pf(k.ty_le_dat)],
      ['Đánh giá tự động', esc(congThucDanhGia(k))],
      ['Chiều KPI', esc(CHIEU[k.chieu] || k.chieu || '—')],
      ['Màu RAG', pill(k.rag) + ' <span class="small muted">căn cứ: ' + esc(k.rag_can_cu || '—') + '</span>'],
      ['Đánh giá của đơn vị', k.danh_gia_don_vi ? esc(k.danh_gia_don_vi) : '<span class="muted">Không có trong dữ liệu đã duyệt (trích từ T11/2026)</span>'],
      S.ss ? ['So ' + nk(S.ss), soSanh(k, S.ss)] : null
    ]) + '</div>';
    // Giai trinh
    h += '<div class="dr-sec"><h3>Giải trình, người phụ trách, tiến độ</h3>';
    if (vds.length) h += vds.map(function (v) {
      return kv([['Vấn đề', esc(v.van_de)], ['Nguyên nhân', esc(v.nguyen_nhan || '—')], ['Hành động', esc(v.hanh_dong || 'Đơn vị chưa nêu')],
        ['Người phụ trách', v.nguoi ? esc(v.nguoi) : '<span class="tag warn">chưa có</span>'], ['Hạn', v.han ? esc(v.han) : '<span class="tag warn">chưa có</span>'],
        v.trang_thai ? ['Tiến độ', esc(v.trang_thai)] : null, ['Nguồn', esc((v.file_nguon || '') + (v.vt ? ', ' + v.vt : ''))]]);
    }).join('<hr style="border:0;border-top:1px dashed #D9E2EC">');
    else if (k.rag === 'Đỏ') h += '<div class="box bad">Đơn vị chưa giải trình</div>';
    else h += '<p class="muted small">Báo cáo không nêu vấn đề cho KPI này.</p>';
    h += '</div>';
    // Nguon
    h += '<div class="dr-sec"><h3>Nguồn số liệu</h3>' + kv([['File', esc(k.file_nguon || '—')], ['Vị trí', esc(k.trang_slide || '—')], ['Cách lấy', esc(CACH_LAY[k.cach_lay] || k.cach_lay || '—')], ['Trạng thái số liệu', esc(k.trang_thai_so_lieu || '—')]]) + '</div>';
    var cl = u.chat_luong_du_lieu.filter(function (c) { return c.ma_kpi === k.ma_kpi && (c.pham_vi || '') === (k.pham_vi || ''); });
    if (cl.length) h += '<div class="dr-sec"><h3>Chất lượng dữ liệu</h3><ul class="plain">' + cl.map(function (c) { return '<li><span class="tag ' + (c.loai === 'Xám' ? 'dashed' : 'warn') + '">' + esc(c.loai) + '</span> ' + esc(c.mo_ta) + '</li>'; }).join('') + '</ul></div>';
    // Lich su
    var ls = KYS.filter(function (x) { return x <= S.ky; }).slice(-12);
    h += '<div class="dr-sec"><h3>Các tháng đã duyệt</h3><div class="tbl-wrap"><table><thead><tr><th>Tháng</th><th class="num">TT</th><th class="num">KH</th><th class="num">% đạt</th><th>RAG</th></tr></thead><tbody>' +
      ls.map(function (ky) { var x = kpiOf(ky, u.id, k.ma_kpi, k.pham_vi); return '<tr><td>' + nk(ky) + '</td><td class="num">' + (x ? hienThi(x) : '—') + '</td><td class="num">' + (x ? nf(x.ke_hoach) : '—') + '</td><td class="num">' + (x ? pf(x.ty_le_dat) : '—') + '</td><td>' + (x ? pill(x.rag) : '—') + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
    if (k.ghi_chu) h += '<div class="dr-sec"><details><summary class="small">Ghi chú đầy đủ trong dữ liệu đã duyệt</summary><p class="small">' + esc(k.ghi_chu) + '</p></details></div>';
    return h;
  }
  function vdDrawer(u, v) {
    var k = v.kpi ? u.kpi.filter(function (x) { return x.ma_kpi === v.kpi; })[0] : null;
    var h = '<div class="dr-crumb">' + esc(u.ten_chuan) + ' · Vấn đề · ' + nk(S.ky) + '</div><h2 class="dr-title" id="drawer-title">' + esc(v.van_de) + '</h2><div class="dr-tags">' +
      (k ? pill(k.rag) : '') + (v.nguoi ? '' : '<span class="tag warn">Chưa có người phụ trách</span>') + (v.han ? '' : '<span class="tag warn">Chưa có hạn</span>') + (v.nguyen_nhan ? '' : '<span class="tag bad">Đơn vị chưa giải trình</span>') + '</div>';
    h += '<div class="dr-sec"><h3>Chi tiết</h3>' + kv([
      ['KPI liên quan', k ? '<button type="button" class="linkish" data-sel="' + esc(keyOf(k)) + '">' + esc(k.ma_kpi + ' ' + lbl(k)) + '</button>' : '—'],
      k ? ['TT / KH', hienThi(k) + ' / ' + nf(k.ke_hoach) + ' ' + esc(k.don_vi_tinh) + ' · đạt ' + pf(k.ty_le_dat)] : null,
      ['Nguyên nhân', esc(v.nguyen_nhan || 'Đơn vị chưa giải trình')],
      ['Hành động', esc(v.hanh_dong || 'Đơn vị chưa nêu')],
      ['Người phụ trách', v.nguoi ? esc(v.nguoi) : '<span class="tag warn">chưa có</span>'],
      ['Hạn', v.han ? esc(v.han) : '<span class="tag warn">chưa có</span>'],
      v.trang_thai ? ['Tiến độ', esc(v.trang_thai)] : null
    ]) + '</div>';
    h += '<div class="dr-sec"><h3>Nguồn</h3>' + kv([['File', esc(v.file_nguon || '—')], ['Vị trí', esc(v.vt || '—')]]) + '</div>';
    return h;
  }
  function viecDrawer(u, x) {
    var t = tachViec(x.noi_dung), nx = nextKyOf(S.ky);
    var h = '<div class="dr-crumb">' + esc(u.ten_chuan) + ' · Đầu việc trọng tâm ' + nk(nx) + '</div><h2 class="dr-title" id="drawer-title">' + esc(t.tieu_de) + '</h2><div class="dr-tags">' +
      t.badge.map(function (b) { return '<span class="tag info">' + esc(b) + '</span>'; }).join('') + '</div>';
    h += '<div class="dr-sec"><h3>Chi tiết</h3>' + kv([
      ['Nội dung', esc(x.noi_dung || '')],
      x.nguoi ? ['Người phụ trách', esc(x.nguoi)] : null,
      x.han ? ['Hạn', esc(x.han)] : null
    ]) + '</div>';
    h += '<div class="dr-sec"><h3>Nguồn</h3>' + kv([['Vị trí', esc(x.nguon || '—')]]) + '</div>';
    return h;
  }
  function openDrawer() {
    var u = unit(S.ky, S.tab), h = null;
    if (u && S.sel) {
      var mv = /^vd-(\d+)$/.exec(S.sel);
      var mj = /^viec-(\d+)$/.exec(S.sel);
      if (mv) { var v = (u.van_de || [])[+mv[1]]; if (v) h = vdDrawer(u, v); }
      else if (mj) { var vc = (u.viec_trong_tam_thang_sau || [])[+mj[1]]; if (vc) h = viecDrawer(u, vc); }
      else { var p = S.sel.split('|'), k = kpiOf(S.ky, u.id, p[0], p[1] || ''); if (k) h = kpiDrawer(u, k); }
    }
    if (!h) { closeDrawerUI(); return; }
    drawerBody.innerHTML = h; drawer.hidden = false; drawer.setAttribute('aria-hidden', 'false'); document.body.classList.add('drawer-open');
    drawer.querySelector('.drawer-panel').scrollTop = 0;
    document.getElementById('drawer-close').focus();
  }
  function closeDrawerUI() { drawer.hidden = true; drawer.setAttribute('aria-hidden', 'true'); document.body.classList.remove('drawer-open'); tipEl.hidden = true; }
  function closeDrawer() { if (!drawer.hidden) go(S.tab); }

  function render() {
    readHash();
    var sig = S.ky + '|' + S.tab + '|' + S.ss;
    if (sig !== lastSig) {
      var giuCuon = lastSig === null && keepScroll; keepScroll = false;
      lastSig = sig; topbar(); sidebar();
      if (!S.ky) { main.innerHTML = '<div class="notice">Bản phát hành không có dữ liệu tháng nào.</div>'; return; }
      if (S.tab === 'overview') overview(); else unitPage(S.tab);
      document.body.classList.remove('nav-open');
      if (!giuCuon) window.scrollTo(0, 0);
    } else if (S.tab !== 'overview') {
      Array.prototype.forEach.call(main.querySelectorAll('tr.hl'), function (r) { r.classList.remove('hl'); });
    }
    if (S.tab !== 'overview' && S.sel) {
      var row = main.querySelector('tr[data-sel="' + S.sel.replace(/"/g, '') + '"]'); if (row) row.classList.add('hl');
      openDrawer();
    } else closeDrawerUI();
  }
  document.addEventListener('click', function (e) {
    if (e.target.closest('#drawer-close') || e.target.id === 'drawer-bg') { closeDrawer(); return; }
    var rg = e.target.closest('[data-rag]');
    if (rg) { var rv = rg.getAttribute('data-rag'); S.rag = rv && S.rag !== rv ? rv : null; lastSig = null; keepScroll = true; render(); var mc = document.getElementById('matrix-card'); if (mc && S.rag) mc.scrollIntoView({ block: 'start' }); return; }
    var b = e.target.closest('[data-go]'); if (b) { go(b.getAttribute('data-go'), b.getAttribute('data-sel')); return; }
    var s = e.target.closest('[data-sel]'); if (s) { go(S.tab, s.getAttribute('data-sel')); return; }
    if (e.target.id === 'btn-print') window.print();
    if (e.target.id === 'nav-toggle') { var o = document.body.classList.toggle('nav-open'); e.target.setAttribute('aria-expanded', o); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeDrawer(); return; }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr.clickable, li.vd-item, li.viec-item')) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'sel-ky') { S.ky = e.target.value; S.ss = prevKy(S.ky); go(S.tab); }
    else if (e.target.id === 'sel-ss') { S.ss = e.target.value || null; go(S.tab); }
    else if (e.target.id === 'sel-trend') { S.trend[e.target.getAttribute('data-unit')] = e.target.value; lastSig = null; keepScroll = true; render(); }
  });
  window.addEventListener('hashchange', render);
  render();
};

</script>
<script>
/* Man hinh khoa: giai ma du lieu AES-256-GCM bang Web Crypto API (khong thu vien ngoai).
 * window.ENC = { v, kdf:'PBKDF2-SHA256', iter, salt, iv, ct } (base64). Khoa = PBKDF2(mat khau, salt, iter) -> AES-GCM 256.
 */
(function () {
  'use strict';
  var E = window.ENC, KEY = 'dash_pw_session';
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  async function decrypt(pw) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(E.salt), iterations: E.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(E.iv) }, key, b64(E.ct));
    return JSON.parse(new TextDecoder().decode(buf));
  }
  var box = document.getElementById('lock'), form = document.getElementById('lock-form'), inp = document.getElementById('lock-pw'), msg = document.getElementById('lock-msg'), btn = document.getElementById('lock-btn');
  async function tryOpen(pw, silent) {
    btn.disabled = true; msg.textContent = 'Đang giải mã…';
    try {
      var data = await decrypt(pw);
      try { sessionStorage.setItem(KEY, pw); } catch (e) {}
      box.hidden = true; document.getElementById('app').hidden = false;
      window.startDashboard(data);
    } catch (e) {
      try { sessionStorage.removeItem(KEY); } catch (x) {}
      msg.textContent = silent ? '' : 'Sai mật khẩu hoặc dữ liệu hỏng. Vui lòng thử lại.';
      btn.disabled = false; inp.value = ''; inp.focus();
    }
  }
  if (!window.crypto || !crypto.subtle) { msg.textContent = 'Trình duyệt không hỗ trợ giải mã (cần mở qua https hoặc file trên Edge/Chrome mới).'; btn.disabled = true; return; }
  form.addEventListener('submit', function (e) { e.preventDefault(); if (inp.value) tryOpen(inp.value, false); });
  var saved = null; try { saved = sessionStorage.getItem(KEY); } catch (e) {}
  if (saved) tryOpen(saved, true); else inp.focus();
})();

</script>
